
name: CI
 
on:
  push:
    branches: [main]
  pull_request:
 
# If you push again before the old run finishes, cancel the old run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
 
jobs:
  ci:
    name: Lint, test & build
    runs-on: ubuntu-latest
    timeout-minutes: 15
 
    # A real PostgreSQL database just for CI
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nexora
          POSTGRES_PASSWORD: nexora
          POSTGRES_DB: nexora_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexora"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
 
    env:
      DATABASE_URL: postgresql://nexora:nexora@localhost:5432/nexora_test
      DATABASE_URL_UNPOOLED: postgresql://nexora:nexora@localhost:5432/nexora_test
 
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
 
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
 
      - name: Install dependencies
        run: npm ci
 
      - name: Generate Prisma client
        run: npx prisma generate --config prisma7.config.ts
 
      # Makes sure all migrations apply cleanly on an empty database
      - name: Apply database migrations
        run: npx prisma migrate deploy --config prisma7.config.ts
 
      - name: Lint
        run: npm run lint
 
      - name: Test
        run: npx vitest run
 
      # next build also type-checks the whole project
      - name: Build
        run: npm run build
 
